# DIGI-TEXX frontend kit. Only kit/ is built and released; the folders around it (docs/, research/…) are reference.
# A push that changes kit/ checks it; a version tag also publishes @dgtx/ui-frek to Nexus.
# Release from kit/: npm run release:alpha | release:patch | release:minor | release:major (kit/release.mjs bumps
# "version" in kit/packages/ui/package.json, commits, and pushes the tag v<version>).
# CI/CD variables (masked): NPM_REGISTRY, the Nexus npm group that installs read from; NPM_PUBLISH_REGISTRY, the hosted
# npm repo the package is deployed to (Nexus OSS refuses deploys to a group: 403 "Deploying to groups is a PRO-licensed
# feature"); NPM_TOKEN, a Nexus token with deploy rights on that hosted repo.
# If they are Protected, protect the release tags too (Settings → Repository → Protected tags: v*),
# otherwise the publish job runs without them and stops at its first check.

image: docker.digi-texx.vn/u-builder:nx20.8.4-node22.21-alpine3.21

stages: [check, publish]

# release.mjs pushes the release commit and its tag together, and GitLab starts one pipeline per ref. The tag pipeline
# checks that same commit and publishes it, so the branch pipeline of a release commit is skipped.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /^release: @dgtx\/ui-frek /'
      when: never
    - when: always

default:
  before_script:
    - cd kit
    # Install from Nexus when the variables are available. npm keys auth by registry URL (//host/path/:_authToken);
    # the token stays in the environment: npm expands ${NPM_TOKEN} itself, nothing secret is written to disk.
    - |
      if [ -n "$NPM_REGISTRY" ]; then
        REGISTRY="${NPM_REGISTRY%/}/"
        echo "registry=$REGISTRY" > .npmrc
        if [ -n "$NPM_TOKEN" ]; then echo "${REGISTRY#https:}:_authToken=\${NPM_TOKEN}" >> .npmrc; fi
      fi

check:
  stage: check
  rules:
    - if: $CI_COMMIT_TAG                        # a release always re-checks before publish
    - changes: [kit/**/*, .gitlab-ci.yml]       # pushes that only touch docs/, research/… run nothing
  script:
    - npm ci
    - npm test
    - npm run typecheck
    - npm run build                    # playground
    - npm run build -w @dgtx/ui-frek   # the library build that publish ships

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  script:
    - |
      if [ -z "$NPM_REGISTRY" ] || [ -z "$NPM_PUBLISH_REGISTRY" ] || [ -z "$NPM_TOKEN" ]; then
        echo "NPM_REGISTRY, NPM_PUBLISH_REGISTRY or NPM_TOKEN is empty in this job. Protected variables reach only protected refs:"
        echo "add the tag pattern v* under Settings → Repository → Protected tags, then run the pipeline of $CI_COMMIT_TAG again."
        exit 1
      fi
    - VERSION=$(node -p "require('./packages/ui/package.json').version")
    - TARGET=$(node -p "require('./packages/ui/package.json').publishConfig.registry")
    - |
      if [ "${CI_COMMIT_TAG#v}" != "$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match version $VERSION in kit/packages/ui/package.json"; exit 1
      fi
      # publishConfig.registry decides where npm publishes (it also guards a manual `npm publish`); it must be the
      # hosted repo in NPM_PUBLISH_REGISTRY, which the token authenticates against
      if [ "${TARGET%/}" != "${NPM_PUBLISH_REGISTRY%/}" ]; then
        echo "publishConfig.registry in kit/packages/ui/package.json ($TARGET) differs from NPM_PUBLISH_REGISTRY ($NPM_PUBLISH_REGISTRY)"; exit 1
      fi
      PUBLISH="${NPM_PUBLISH_REGISTRY%/}/"
      echo "${PUBLISH#https:}:_authToken=\${NPM_TOKEN}" >> .npmrc
    # a pre-release goes out under its own dist-tag (1.2.0-alpha.3 → "alpha", 1.2.0-rc.1 → "rc"; "next" when the
    # id is a bare number), so `npm i @dgtx/ui-frek` keeps getting the last stable version
    - |
      case "$VERSION" in
        *-*) DIST_TAG=$(echo "${VERSION#*-}" | cut -d. -f1); case "$DIST_TAG" in *[!0-9]*) ;; *) DIST_TAG=next ;; esac ;;
        *) DIST_TAG=latest ;;
      esac
    - npm ci
    - npm publish -w @dgtx/ui-frek --tag "$DIST_TAG"   # prepack builds dist/
