# On the deploy machine: git pull && docker compose up -d --build
services:
  web:
    build:
      context: .
      # the repo root, for its .git: the changelog page is built from the history
      additional_contexts:
        repo: ..
      args:
        # NPM_REGISTRY=https://nexus.digi-texx.vn/repository/npm/ docker compose up -d --build
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: dtx-frek
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    # Real customer samples are excluded from the image. Uncomment only if this machine may serve them.
    # volumes:
    #   - ./apps/playground/public/samples:/usr/share/nginx/html/samples:ro
